name: workflow

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  # Node.js tests on multiple versions
  node-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

  # Docker image build + test
  docker-tests:
    runs-on: ubuntu-latest
    needs: node-tests   # only build Docker image if node-tests pass
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag my-image:latest

      - name: Run tests inside Docker image
        run: docker run --rm my-image:latest npm test
